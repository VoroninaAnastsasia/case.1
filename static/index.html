<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анализ текста</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      font-size: 14px;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #357ab8;
    }

    #result {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
    }

    .positive { color: green; font-weight: bold; }
    .negative { color: red; font-weight: bold; }
    .neutral  { color: gray; font-weight: bold; }
    .error    { color: red; }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 13px;
      color: #666;
    }

    footer a {
      color: #4a90e2;
    }
  </style>
</head>
<body>

  <h1>Анализ текста</h1>

  <div class="card">
    <p>Введите текст для анализа:</p>
    <textarea id="text"></textarea>
    <br>
    <button onclick="analyze()">Анализировать</button>
    <div id="result"></div>
  </div>

  <footer>
    Проект студентов: Воронина Анастасия, Санкина Анастасия, Леонова Алёна<br>
    <a href="https://github.com/VoroninaAnastsasia/case.1" target="_blank">Ссылка на GitHub</a>
  </footer>

  <script>
    // Функция отправляет текст на сервер и показывает результат
    function analyze() {
      var text = document.getElementById("text").value;
      var resultDiv = document.getElementById("result");

      if (text == "") {
        resultDiv.innerHTML = "<span class='error'>Введите текст</span>";
        return;
      }

      resultDiv.innerHTML = "Загрузка...";

      fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        var html = "";
        html += "<p><b>Язык:</b> " + data.language + "</p>";
        html += "<p><b>Тональность:</b> <span class='" + data.polarity + "'>" + data.polarity + "</span></p>";
        html += "<p><b>Субъективность:</b> " + Math.round(data.subjectivity * 100) + "%</p>";
        html += "<p><b>Слов:</b> " + data.stats.word_count + "</p>";
        html += "<p><b>Предложений:</b> " + data.stats.sentence_count + "</p>";
        html += "<p><b>Итог:</b> " + data.interpretation + "</p>";
        resultDiv.innerHTML = html;
      })
      .catch(function(error) {
        resultDiv.innerHTML = "<span class='error'>Ошибка: " + error + "</span>";
      });
    }
  </script>

</body>
</html>
